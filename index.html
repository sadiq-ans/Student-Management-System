<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- CSS Style -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container mt-4 py-5">

        <h2 class="text-white text-center mb-4">Student Management System</h2>

        <div class="row">

            <!-- FORM SECTION -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header text-center text-white" style="background-color: #7066e0;">Manage Students
                    </div>

                    <div class="card-body">

                        <form id="studentForm">

                            <!-- HIDDEN FIELD FOR UPDATE FIX -->
                            <input type="hidden" id="oldRoll">

                            <label>Roll No</label>
                            <input id="roll" class="form-control mb-2">

                            <label>Name</label>
                            <input id="name" class="form-control mb-2">

                            <label>Email</label>
                            <input id="email" class="form-control mb-2">

                            <label>Gender</label>
                            <select id="gender" class="form-control mb-2">
                                <option value="">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>

                            <label>Contact</label>
                            <input id="contact" class="form-control mb-2">

                            <label>D.O.B</label>
                            <input id="dob" type="date" class="form-control mb-2">

                            <label>Address</label>
                            <textarea id="address" class="form-control mb-2"></textarea>

                            <div class="button-group">
                                <button type="button" class="btn btn-success mb-2 w-100"
                                    onclick="addStudent()">Add</button>
                                <button type="button" class="btn btn-warning mb-2 w-100"
                                    onclick="updateStudent()">Update</button>
                                <button type="reset" class="btn btn-secondary w-100">Clear</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <!-- TABLE SECTION -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white text-center">Student Records</div>

                    <div class="card-body">
                        <table class="table table-bordered table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Roll No</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Gender</th>
                                    <th>Contact</th>
                                    <th>DOB</th>
                                    <th>Address</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

    <script src="./assets/js/script.js"></script>
</body>

</html>
